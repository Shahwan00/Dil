<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <!-- عند الضغط على الزر سيتم التوجه لصفحة home.html -->
        <form class="login-box" onsubmit="event.preventDefault(); window.location.href='home.html';">
            <h2>Welcome Back</h2>
            <p>Login To Continue</p>

            <div class="input-box">
                <label>Email Address</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" value="shah@gmail.com" required>
                </div>
            </div>

            <div class="input-box">
                <label>Password</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" value="123456" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember Me
                </label>
                <a href="#" class="forgot-btn">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-check"></i> Login Successful
            </button>

            <p class="register-text">
                Don't have an account? <a href="#">Register</a>
            </p>
        </form>
    </div>

</body>
</html>
